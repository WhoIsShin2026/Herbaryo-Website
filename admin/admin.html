<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Herbaryo | Admin</title>
    <link rel="icon" type="image/png" sizes="64x64" href="../img/logo/favicon.png">
    <link rel="apple-touch-icon" href="../img/logo/apple-touch-icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./admin.css">
    <link rel="stylesheet" href="../main/motion.css">
</head>

<body>
    <header class="admin-header">
        <div class="container">
            <div class="logo">
                <div class="logo-link" id="scrollToTop" aria-label="Admin page">
                    <img class="site-logo" src="../img/logo/herbaryo-logo.png" alt="Herbaryo" width="384" height="120">
                </div>
                <span class="page-tag">Admin</span>
            </div>
            <div class="admin-user">
                <button class="admin-menu-toggle" id="adminMenuBtn" type="button" aria-label="Open admin menu"
                    aria-controls="adminActions" aria-expanded="false">
                    <span></span>
                    <span></span>
                    <span></span>
                </button>
                <div class="admin-actions" id="adminActions">
                    <a href="../dashboard/dashboard.html" class="dashboard-btn">Dashboard</a>
                    <button class="logout-btn" id="logoutBtn">Logout</button>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div class="admin-access-status" id="adminAccessStatus" role="alert" hidden></div>
        <div class="admin-tabs" id="adminTabs" role="tablist" aria-label="Admin sections" hidden>
            <button class="admin-tab active" type="button" role="tab" aria-selected="true"
                data-admin-tab="adminPlayersPanel">Players</button>
            <button class="admin-tab" type="button" role="tab" aria-selected="false"
                data-admin-tab="adminReportsPanel">Reports <span class="admin-tab-count" id="newReportsCount"
                    hidden>0</span></button>
            <button class="admin-tab" type="button" role="tab" aria-selected="false"
                data-admin-tab="adminNewsPanel">News</button>
        </div>

        <div class="admin-panel" id="adminPlayersPanel">
        <section class="admin-stats">
            <h2>Total Players</h2>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-number" id="totalUsers">0</div>
                    <div class="stat-label">Registered</div>
                </div>
            </div>
        </section>

        <section class="users-section">
            <h2>Manage Players</h2>
            <div class="search-section">
                <input type="text" id="searchInput" placeholder="🔍 Search players by name or email...">
            </div>
            <div class="table-container">
                <table id="usersTable">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="3">Loading players...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </section>
        </div>

        <div class="admin-panel" id="adminReportsPanel" hidden>
            <section class="users-section">
                <h2>Reports</h2>
                <div class="admin-filters">
                    <label class="field-group">Type
                        <select id="reportTypeFilter">
                            <option value="">All</option>
                            <option value="Bug">Bug</option>
                            <option value="Feedback">Feedback</option>
                            <option value="Suggestion">Suggestion</option>
                        </select>
                    </label>
                    <label class="field-group">Status
                        <select id="reportStatusFilter">
                            <option value="">All</option>
                            <option value="New">New</option>
                            <option value="Seen">Seen</option>
                            <option value="Fixed">Fixed</option>
                        </select>
                    </label>
                </div>
                <div class="admin-card-list" id="adminReportsList">
                    <p class="admin-note">Loading reports...</p>
                </div>
            </section>
        </div>

        <div class="admin-panel" id="adminNewsPanel" hidden>
            <section class="users-section">
                <h2>Latest Version</h2>
                <form class="admin-form" id="latestVersionForm">
                    <label class="field-group">Version
                        <input type="text" id="latestVersionInput" maxlength="20" placeholder="0.8.12" required>
                    </label>
                    <label class="field-group">Download link
                        <input type="url" id="latestLinkInput" maxlength="300" placeholder="https://drive.google.com/..."
                            required>
                    </label>
                    <p class="admin-form-error" id="latestVersionError" role="alert"></p>
                    <button class="action-btn btn-view" type="submit">Save Version</button>
                </form>
                <form class="admin-form" id="buyPageForm">
                    <label class="field-group">Buy page link (the game opens this)
                        <input type="url" id="buyPageInput" maxlength="300" placeholder="https://your-site.netlify.app/buy/buy.html"
                            required>
                    </label>
                    <button class="action-btn btn-view" type="submit">Save Link</button>
                </form>
            </section>
            <section class="users-section">
                <h2>Post News</h2>
                <form class="admin-form" id="newsForm">
                    <label class="field-group">Title
                        <input type="text" id="newsTitle" maxlength="80" required>
                    </label>
                    <label class="field-group">Text
                        <textarea id="newsText" rows="5" maxlength="2000" required></textarea>
                    </label>
                    <label class="field-group">Version (optional)
                        <input type="text" id="newsVersion" maxlength="20" placeholder="0.8.12">
                    </label>
                    <button class="action-btn btn-view" type="submit">Post</button>
                </form>
                <div class="admin-card-list" id="adminNewsList">
                    <p class="admin-note">Loading news...</p>
                </div>
            </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>© 2026 Herbaryo - Thesis Game by Real's Group. Preserving Philippine herbal knowledge through
                gamification.</p>
        </div>
    </footer>

    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script defer src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script defer src="../main/database-schema.js"></script>
    <script defer src="./admin.js"></script>
</body>

</html>
